name: Android APK

# Builds an installable release APK pointing at the demo backend and attaches it to the run (Actions -> Android APK ->
# Run workflow -> open the run -> Artifacts) and to a DRAFT release (Releases -> "Android APK #<run>"; drafts are visible
# only to people with write access and do not use the Actions artifact storage quota, which can be exhausted).
# By hand only, so nothing from forks ever reaches the runner.
# Needs the Android SDK on the runner (docs/CI.md "Android APK"). Signed with the debug key: fine for sideloading,
# not for Google Play.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Backend origin baked into the app (no trailing slash)
        default: https://feya-backend-sea8.onrender.com

permissions:
  contents: write  # draft release with the APK

jobs:
  apk:
    name: Build APK
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: ${{ vars.CI_RUNS_ON == '' }}
      - name: Locate the Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ] && [ -d "$HOME/Android/Sdk" ]; then
            echo "ANDROID_HOME=$HOME/Android/Sdk" >> "$GITHUB_ENV"
          fi
      - run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ inputs.api_base_url }}
      - name: Attach the APK to a draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          tag_name: apk-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Android APK #${{ github.run_number }}
          body: Debug-signed release APK for sideloading (demo backend ${{ inputs.api_base_url }}), built from ${{ github.sha }}.
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
      # Best effort: fails when the Actions artifact storage quota is exhausted, which must not fail the build.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: feya-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
