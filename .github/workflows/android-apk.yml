name: Android APK

# Builds an installable release APK pointing at the demo backend and attaches it to the run (Actions -> Android APK ->
# Run workflow -> open the run -> Artifacts). By hand only, so nothing from forks ever reaches the runner.
# Needs the Android SDK on the runner (docs/CI.md "Android APK"). Signed with the debug key: fine for sideloading,
# not for Google Play.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Backend origin baked into the app (no trailing slash)
        default: https://feya-backend-sea8.onrender.com

permissions:
  contents: read

jobs:
  apk:
    name: Build APK
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: ${{ vars.CI_RUNS_ON == '' }}
      - name: Locate the Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ] && [ -d "$HOME/Android/Sdk" ]; then
            echo "ANDROID_HOME=$HOME/Android/Sdk" >> "$GITHUB_ENV"
          fi
      - run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ inputs.api_base_url }}
      - uses: actions/upload-artifact@v4
        with:
          name: feya-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
