name: Runner smoke test

# Checks that the self-hosted runner picks up jobs (docs/CI.md "Self-hosted runner").
# Runs on a push that touches this file, or by hand. Costs no Actions minutes.
on:
  push:
    branches: [main]
    paths: [".github/workflows/runner-smoke.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - run: |
          echo "CI_RUNS_ON='${{ vars.CI_RUNS_ON }}'"
          uname -a
          docker version --format '{{.Server.Version}}'
          java -version 2>&1 | head -1 || true
